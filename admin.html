<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Studio | जनप्रदेश 24 NEWS</title><link rel="stylesheet" href="style.css"><link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="adminbody"><div class="adminwrap">
<div class="adminhead"><h1>जनप्रदेश 24 — Newsroom Admin</h1><a class="adminlink" href="index.html">वेबसाइट देखें</a></div>
<div id="loginPanel" class="panel loginbox"><h1>Admin Login</h1><p class="muted">केवल अधिकृत एडमिन लॉगिन करें।</p><div class="field"><label>Email</label><input id="loginEmail" type="email" value="janpradesh24@gmail.com" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn" id="loginBtn">Login</button></div><div id="loginStatus" class="status"></div></div>
<div id="studio" class="hidden">
<div class="panel"><div class="adminhead"><h2 style="margin:0;font-size:19px">खबर लिखें / संपादित करें</h2><button class="btn secondary" id="logoutBtn">Logout</button></div><div id="status" class="status"></div>
<form id="newsForm"><input type="hidden" id="postId"><div class="formgrid">
<div class="field full"><label>खबर की हेडलाइन *</label><input id="title" required maxlength="220" placeholder="मुख्य खबर का शीर्षक"></div>
<div class="field full"><label>उपशीर्षक</label><input id="subtitle" maxlength="300" placeholder="खबर का छोटा सार"></div>
<div class="field"><label>श्रेणी *</label><select id="category" required></select></div><div class="field"><label>स्थान</label><input id="location" placeholder="आरोन, जिला गुना"></div>
<div class="field"><label>रिपोर्टर</label><input id="reporter" placeholder="रिपोर्टर का नाम"></div>
<div class="field"><label>फोटो अपलोड (JPG/PNG/WEBP, अधिकतम 10MB)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><input id="imageUrl" placeholder="या फोटो का URL"></div>
<div class="field full"><label>वीडियो अपलोड (MP4/WEBM/MOV, अधिकतम 50MB)</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><input id="videoUrl" placeholder="या वीडियो URL"></div>
<div class="field full"><label>पूरी खबर *</label><div id="editor" class="editor"></div></div>
<div class="field full checkrow"><label><input id="breaking" type="checkbox"> Breaking News</label><label><input id="publish" type="checkbox"> अभी Publish करें</label></div></div>
<div class="actions"><button class="btn" type="submit" id="saveBtn">खबर सेव करें</button><button class="btn secondary" type="button" id="previewBtn">Preview</button><button class="btn light" type="button" id="newBtn">नई खबर</button></div></form></div>
<div class="panel"><div class="adminhead"><h2 style="margin:0;font-size:19px">खबरें मैनेज करें</h2><button class="btn light" id="refreshBtn">Refresh</button></div><div id="postsList" class="newslist">खबरें लोड हो रही हैं…</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script><script src="admin.js"></script></body></html>
